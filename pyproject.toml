[project]
name = "docreview-rag"
version = "0.1.0"
description = "Source-grounded SEC and DART filing retrieval and review"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "mcp>=2.1.1,<3",
    "openai>=2.53.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "starlette<2",
    "tiktoken>=0.14.0",
    "tqdm>=4.67",
    "uvicorn>=0.52.1",
]


[project.optional-dependencies]
# uv sync --extra cpu      # development and deployment default
# uv sync --extra rocm     # AMD; see docs before enabling on an iGPU
# uv sync --extra cu130    # NVIDIA
cpu = [
    "torch>=2.12",
    "sentence-transformers>=3.0",
]
cu130 = [
    "torch>=2.12",
    "sentence-transformers>=3.0",
]
rocm = [
    "torch>=2.12",
    "sentence-transformers>=3.0",
    "triton-rocm>=3.7",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu130" }, { extra = "rocm" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]

# `explicit = true` keeps these indexes from serving any package that is not
# routed here by [tool.uv.sources]; PyPI stays the default for everything else.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[dependency-groups]
# uv sync --group dev
dev = [
    "pytest>=8.4",       # Test runner
    "pytest-cov>=6.0",   # Coverage — uv run pytest --cov=app
    "ruff>=0.16",        # Linter + formatter (uses the [tool.ruff] settings below)
    "ipython>=9.0",      # Interactive REPL — uv run ipython
    "basedpyright>=1.39.10",
]


[tool.pytest.ini_options]
markers = [
    "live_postgres: executes SQL against the configured live PostgreSQL database",
]


[tool.ruff]
line-length = 100
target-version = "py314" # python 3.14

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (PEP8 Error)
    "W",   # pycodestyle (PEP8 Warning)
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle (docstring)
	"ANN", # flake8-annotations
]
ignore = [
    "E203",
    "E266",
    "D203",
    "D212",
	"D100",
	"D205",
	"ANN002",
	"ANN003",
	"ANN204"
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Test function annotations and docstrings do not contribute to contract validation.
# `P` is the "module under test" fixture, so its single uppercase letter is intentional.
"tests/*" = ["N802", "N803", "ANN", "D"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
# Without this, they are classified as third-party packages and import ordering breaks.
known-first-party = ["app", "tests"]

# pydocstyle settings (docstring style)
[tool.ruff.lint.pydocstyle]
convention = "numpy"

# pyright / Pylance
# Single source of truth for type checking. Both Pylance (editor) and basedpyright (CLI)
# read this section. Do not set typeCheckingMode in .vscode/settings.json to avoid duplication.
[tool.coverage.report]
# Report a module even when its directory has no __init__.py. Without this,
# coverage silently drops such files instead of showing them at 0%.
include_namespace_packages = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
