[project]
name = "docreview-rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.18.4",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "redis>=5.3.1",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]   # tests에서 `import app`이 되도록 레포 루트를 sys.path에 추가
asyncio_mode = "auto"   # async 테스트 함수 자동 실행 (test_db.py)
asyncio_default_test_loop_scope = "session"   # 모든 async 테스트가 한 이벤트 루프 공유 (모듈 engine 재사용 안전)

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.19",
]
scratch = [
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.0",
    "openai>=2.44.0",
]
