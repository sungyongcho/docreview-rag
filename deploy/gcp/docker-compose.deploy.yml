# Production compose for the single e2-medium VM (4 GB RAM + 2 GB swap).
# deploy_backend.sh copies this file to /opt/docreview/docker-compose.yml and
# writes the generated VM env (from the repo .env) to /opt/docreview/.env.
services:
  db:
    image: pgvector/pgvector:pg16
    # Bound database memory so the API and CPU reranker share the 4 GB VM.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_DB: filing
      POSTGRES_USER: filing
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - /var/lib/docreview/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filing -d filing"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${DOCREVIEW_IMAGE:?Set DOCREVIEW_IMAGE}
    user: "10001:10001"
    environment:
      CORPUS_DIR: /app/data/corpus
      DATABASE_URL: postgresql+asyncpg://filing:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/filing
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-large
      EMBED_DIM: "384"
      DOCREVIEW_MODE: runtime
      MODE: prod
      DOCREVIEW_ADMIN_MODE: "off"
      DOCREVIEW_HOST: 127.0.0.1
      DOCREVIEW_TRUST_PROXY_HEADERS: "true"
      DOCREVIEW_RATE_LIMIT_PER_MINUTE: "10"
      DOCREVIEW_RATE_LIMIT_PER_DAY: "50"
      OPENAI_API_KEY_PROD: ${OPENAI_API_KEY_PROD:?Set OPENAI_API_KEY_PROD}
      DOCREVIEW_PUBLIC_DAILY_COST_USD: "0.30"
      DOCREVIEW_OPENAI_MAX_COST_USD: "0.005"
      REVIEW_MAX_COST_USD: "0.005"
      DOCREVIEW_OPENAI_MODEL: gpt-5.6-luna
      REVIEW_MODEL: gpt-5.6-luna
      DOCREVIEW_PUBLIC_ALLOWANCE_PATH: /app/data/runtime/public-ai-limits.sqlite3
      HF_HOME: /app/data/runtime/huggingface
      # SEC_USER_AGENT and DART_API_KEY are intentionally unset: acquisition never runs
      # in production. The corpus is prepared locally and copied into
      # /var/lib/docreview/corpus.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/lib/docreview/corpus:/app/data/corpus:ro
      - /var/lib/docreview/eval-runs:/app/data/eval_runs:ro
      - /var/lib/docreview/runtime:/app/data/runtime
      # data/golden, data/presets and data/local-settings are intentionally not
      # mounted: writes to them are DEV-only, so the image's built-in copies suffice.
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  caddy:
    image: caddy:2.10-alpine
    depends_on: [app]
    # Plain HTTP only. TLS terminates at Cloudflare; the Worker reaches this port over
    # http://<ephemeral ip>:8000 and the GCP firewall admits Cloudflare IPv4 ranges only.
    ports: ["${DOCREVIEW_ORIGIN_PORT:-8000}:80"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/docreview/caddy-data:/data
      - /var/lib/docreview/caddy-config:/config
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}
