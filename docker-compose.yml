services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: filing
      POSTGRES_USER: filing
      POSTGRES_PASSWORD: filing
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filing -d filing"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CORPUS_DIR: /app/data/corpus
      DATABASE_URL: postgresql+asyncpg://filing:filing@db:5432/filing
      EMBEDDING_PROVIDER: deterministic
    depends_on:
      db:
        condition: service_healthy
    ports: ["${APP_PORT:-8000}:8000"]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  pg_data:
