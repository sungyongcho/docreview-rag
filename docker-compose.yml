services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: filing
      POSTGRES_USER: filing
      POSTGRES_PASSWORD: filing
    ports:
      - "${DOCREVIEW_LOCAL_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filing -d filing"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The local image serves static files and FastAPI from one origin. Public
        # Firebase builds override these with the Cloudflare API URL and canned lab.
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_ADMIN_MODE: ${NEXT_PUBLIC_ADMIN_MODE:-live}
    environment:
      CORPUS_DIR: /app/data/corpus
      DATABASE_URL: postgresql+asyncpg://filing:filing@db:5432/filing
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      DOCREVIEW_MODE: runtime
      DOCREVIEW_ADMIN_MODE: ${DOCREVIEW_ADMIN_MODE:-live}
      DOCREVIEW_HOST: 127.0.0.1
      DOCREVIEW_ADMIN_CORS_ORIGIN: ${DOCREVIEW_ADMIN_CORS_ORIGIN:-http://127.0.0.1:3000}
      DOCREVIEW_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_PROTOCOL: ${LOCAL_LLM_PROTOCOL:-auto}
    depends_on:
      db:
        condition: service_healthy
    ports: ["${DOCREVIEW_LOCAL_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"]
    init: true
    group_add:
      - "${HOST_GID:-1000}"
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image's own HEALTHCHECK applies; duplicating it here would give the same
    # probe two diverging definitions.

volumes:
  pg_data:
